# =============================================================================
# ONE-SHOT: prove the Engineer/Application role change landed on PRODUCTION —
# the Postgres CHECK migration (drop -> convert -> re-add) and the new role
# endpoints. Creates two throwaway users, exercises their parity permissions,
# removes every trace (owner-role psql), verifies master-only counts.
#
# Runs only when the pushed commit message contains "[probe-roles]".
# =============================================================================

name: Probe roles migration (one-shot)

on:
  push:
    branches: [arena/01a0d728-labcare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-roles]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          npx --yes @insforge/cli link \
            --api-base-url https://yj675q8e.ap-southeast.insforge.app \
            --api-key "$INSFORGE_API_KEY" --guard off --json
          test -s .insforge/project.json

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Fetch the Postgres DSN (value never echoed)
        id: dsn
        run: |
          set -euo pipefail
          dsn="$(npx --yes @insforge/cli --json db connection-string | jq -r '.connectionURL // empty')"
          [ -n "$dsn" ] || { echo "::error::no DSN"; exit 1; }
          echo "::add-mask::$dsn"
          echo "dsn=$dsn" >> "$GITHUB_OUTPUT"

      - name: Seed sentinels (cleanup must run even on failure)
        run: echo "CID=0" >> "$GITHUB_ENV"

      - name: Pre-clean any residue from a previous abort
        env:
          DSN: ${{ steps.dsn.outputs.dsn }}
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 <<SQL
          DELETE FROM sessions      WHERE user_id IN (SELECT id FROM users WHERE email LIKE '%@rolesprobe.example');
          DELETE FROM comments      WHERE entity_type='breakdown' AND entity_id IN (SELECT id FROM breakdowns WHERE subject='roles probe');
          DELETE FROM notifications WHERE entity_type='breakdown' AND entity_id IN (SELECT id FROM breakdowns WHERE subject='roles probe');
          DELETE FROM audit_logs    WHERE (entity_type='breakdown' AND entity_id IN (SELECT id FROM breakdowns WHERE subject='roles probe'))
                                     OR (entity_type='customer'  AND entity_id IN (SELECT id FROM customers WHERE name='Roles Probe Clinic'));
          DELETE FROM breakdowns    WHERE subject='roles probe';
          DELETE FROM users         WHERE email LIKE '%@rolesprobe.example';
          DELETE FROM customers     WHERE name='Roles Probe Clinic';
          SQL

      - name: Probe roles over HTTPS
        env:
          PROD: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev
        run: |
          set -euo pipefail
          curl() { command curl -sS --noproxy '*' --retry 5 --retry-all-errors --retry-delay 3 "$@"; }

          code="$(curl -o /tmp/login.json -w '%{http_code}' -X POST "$PROD/api/login" \
            -H 'Content-Type: application/json' -d '{"email":"admin@labcare.com","password":"Demo123!"}')"
          tok="$(jq -r '.token // empty' /tmp/login.json)"
          [ -n "$tok" ] || { echo "::error title=login failed::HTTP $code: $(cat /tmp/login.json)"; exit 1; }
          echo "::notice::login OK (HTTP $code)"

          cid="$(curl -sSf -X POST "$PROD/api/customers" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' -d '{"name":"Roles Probe Clinic"}' | jq -r .id)"
          echo "CID=$cid" >> "$GITHUB_ENV"

          # legacy value must be rejected
          code="$(curl -o /tmp/legacy.json -w '%{http_code}' -X POST "$PROD/api/users" \
            -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
            -d "{\"name\":\"Ghost\",\"email\":\"ghost@rolesprobe.example\",\"password\":\"Ghost123\",\"role\":\"technician\",\"customer_id\":$cid}")"
          [ "$code" = "400" ] || { echo "::error::legacy role should 400, got $code: $(cat /tmp/legacy.json)"; exit 1; }
          echo "::notice::legacy 'technician' role rejected (400)"

          # both new roles must be creatable and loginable
          eng="$(curl -sSf -X POST "$PROD/api/users" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"Engr Probe\",\"email\":\"eng@rolesprobe.example\",\"password\":\"Eng12345\",\"role\":\"engineer\",\"customer_id\":$cid}")"
          [ "$(echo "$eng" | jq -r .role)" = "engineer" ] || { echo "::error::engineer create: $eng"; exit 1; }
          app="$(curl -sSf -X POST "$PROD/api/users" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"App Probe\",\"email\":\"app@rolesprobe.example\",\"password\":\"App12345\",\"role\":\"application\",\"customer_id\":$cid}")"
          [ "$(echo "$app" | jq -r .role)" = "application" ] || { echo "::error::application create: $app"; exit 1; }
          echo "::notice::engineer + application users created"

          etok="$(curl -sS -X POST "$PROD/api/login" -H 'Content-Type: application/json' \
            -d '{"email":"eng@rolesprobe.example","password":"Eng12345"}' | jq -r .token)"
          atok="$(curl -sS -X POST "$PROD/api/login" -H 'Content-Type: application/json' \
            -d '{"email":"app@rolesprobe.example","password":"App12345"}' | jq -r .token)"
          [ -n "$etok" ] && [ -n "$atok" ]

          # parity: both can hit the renamed assignee list
          lst="$(curl -sSf "$PROD/api/engineers" -H "Authorization: Bearer $atok")"
          echo "$lst" | jq -e 'map(.role) | (contains(["engineer"]) and contains(["application"]))' > /dev/null \
            || { echo "::error::/api/engineers missing probe users: $lst"; exit 1; }
          echo "::notice::/api/engineers lists engineer + application users"

          # parity on ticket work: application accepts + comments
          bid="$(curl -sSf -X POST "$PROD/api/breakdowns" -H "Authorization: Bearer $etok" \
            -H 'Content-Type: application/json' \
            -d "{\"customer_id\":$cid,\"subject\":\"roles probe\",\"fault_description\":\"probe\",\"priority\":\"low\"}" | jq -r .id)"
          curl -sSf -X POST "$PROD/api/breakdowns/$bid/accept" -H "Authorization: Bearer $atok" \
            -H 'Content-Type: application/json' -d '{}' > /dev/null
          curl -sSf -X POST "$PROD/api/comments" -H "Authorization: Bearer $atok" \
            -H 'Content-Type: application/json' \
            -d "{\"entity_type\":\"breakdown\",\"entity_id\":$bid,\"text\":\"application user at parity\"}" > /dev/null
          echo "::notice::application user accepted + commented on a breakdown"
          echo "BID=$bid" >> "$GITHUB_ENV"

      - name: Verify migrated CHECK constraint + cleanup probe rows (owner role)
        if: always()
        env:
          DSN: ${{ steps.dsn.outputs.dsn }}
        run: |
          set -euo pipefail
          chk="$(psql "$DSN" -tAc "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname='users_role_check'")"
          echo "::notice title=users role CHECK::$chk"
          echo "$chk" | grep -q "'engineer'" && echo "$chk" | grep -q "'application'" \
            || { echo "::error::users CHECK was not widened: $chk"; exit 1; }
          echo "::notice::Postgres role CHECK migrated"
          psql "$DSN" -v ON_ERROR_STOP=1 <<SQL
          -- sessions first: sessions.user_id FKs users, so users must go last
          DELETE FROM sessions      WHERE user_id IN (SELECT id FROM users WHERE email LIKE '%@rolesprobe.example');
          DELETE FROM comments      WHERE entity_type='breakdown' AND entity_id=$BID;
          DELETE FROM notifications WHERE entity_type='breakdown' AND entity_id=$BID;
          DELETE FROM audit_logs    WHERE (entity_type='breakdown' AND entity_id=$BID)
                                     OR (entity_type='user'      AND detail LIKE '%rolesprobe%')
                                     OR (entity_type='customer'  AND entity_id=$CID);
          DELETE FROM breakdowns    WHERE id=$BID;
          DELETE FROM users         WHERE email LIKE '%@rolesprobe.example';
          DELETE FROM customers     WHERE id=$CID;
          DELETE FROM sessions      WHERE user_id=1;
          SQL
          echo "::notice::probe rows removed"

      - name: Verify — production back to master-only
        env:
          DSN: ${{ steps.dsn.outputs.dsn }}
        if: always()
        run: |
          set -euo pipefail
          u=$(psql "$DSN" -tAc "SELECT count(*) FROM users")
          c=$(psql "$DSN" -tAc "SELECT count(*) FROM customers")
          echo "::notice title=row counts::users=$u customers=$c"
          [ "$u" = "1" ] && [ "$c" = "0" ]
          echo "::notice::ROLES PROBE PASSED"
