# =============================================================================
# ONE-SHOT: reset the PRODUCTION InsForge Postgres to a fresh, seeded-equivalent
# state — every table emptied, only the Master System Admin kept.
#
# SAFETY GATE: runs only when the pushed commit message contains
# "[reset-prod-db]". Any other push skips it. Delete this file after use.
#
# Uses the repository secret INSFORGE_API_KEY (API-key auth, no OAuth), exactly
# like the Deploy workflow. Why a workflow: the coding sandbox cannot reach
# InsForge (egress firewall); GitHub runners can.
# =============================================================================

name: Reset production database (one-shot)

on:
  push:
    branches: [arena/01a0d728-labcare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-prod-db
  cancel-in-progress: false

jobs:
  reset:
    # Hard gate: smoke out accidental runs. Only a commit that explicitly asks
    # for the reset with the marker phrase will execute this job.
    if: contains(github.event.head_commit.message, '[reset-prod-db]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          npx --yes @insforge/cli link \
            --api-base-url https://yj675q8e.ap-southeast.insforge.app \
            --api-key "$INSFORGE_API_KEY" --guard off --json
          test -s .insforge/project.json

      - name: Wipe all app data (users kept separately below)
        run: |
          set -euo pipefail
          TABLES="onboarding_apps categories equipment locations departments complaints breakdowns comments audit_logs sessions attachments notifications notification_pings pm_schedules pm_logs portal_links push_subscriptions app_devices admin_customer_links customers"
          run_q () {
            if ! out="$(npx --yes @insforge/cli db query $2 "$1" 2>&1)"; then
              msg="$(printf '%s' "$out" | tr '\n\r' '  ' | head -c 800)"
              echo "::error title=db query failed::$msg"
              return 1
            fi
            notice="$(printf '%s' "$out" | tr '\n\r' '  ' | head -c 300)"
            echo "::notice title=db query ok::$notice"
          }
          # no RESTART IDENTITY: the API role does not own the *_seq sequences
          LIST="$(printf '%s' "$TABLES" | tr ' ' ',')"
          if ! run_q "TRUNCATE TABLE $LIST CASCADE"; then
            echo "::warning::TRUNCATE unavailable — falling back to per-table DELETE (unrestricted mode)"
            for t in $TABLES; do run_q "DELETE FROM $t" --unrestricted; done
          fi

      - name: Delete every user except the Master System Admin
        run: |
          set -euo pipefail
          run_q () {
            if ! out="$(npx --yes @insforge/cli db query $2 "$1" 2>&1)"; then
              msg="$(printf '%s' "$out" | tr '\n\r' '  ' | head -c 800)"
              echo "::error title=db query failed::$msg"
              return 1
            fi
            notice="$(printf '%s' "$out" | tr '\n\r' '  ' | head -c 300)"
            echo "::notice title=db query ok::$notice"
          }
          run_q "DELETE FROM users WHERE lower(email) <> 'admin@labcare.com'" \
            || run_q "DELETE FROM users WHERE lower(email) <> 'admin@labcare.com'" --unrestricted

      - name: Verify — only the Master System Admin remains
        run: |
          npx --yes @insforge/cli db query "SELECT id, name, email, role, customer_id FROM users" || true
          npx --yes @insforge/cli db query "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM customers) AS customers, (SELECT count(*) FROM equipment) AS equipment, (SELECT count(*) FROM complaints) AS complaints, (SELECT count(*) FROM breakdowns) AS breakdowns" || true

      - name: Verify — only the Master System Admin remains
        run: |
          npx --yes @insforge/cli db query "SELECT id, name, email, role, customer_id FROM users" || true
          npx --yes @insforge/cli db query "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM customers) AS customers, (SELECT count(*) FROM equipment) AS equipment, (SELECT count(*) FROM complaints) AS complaints, (SELECT count(*) FROM breakdowns) AS breakdowns" || true
