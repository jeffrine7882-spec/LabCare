# =============================================================================
# ONE-SHOT smoke test: prove GET /api/portal/<token>/events works against the
# PRODUCTION InsForge stack (Postgres + Flask). Provisions a throwaway
# customer + portal link + complaint, asserts the feed's behaviour, then
# removes every trace (owner-role psql) and reports master-only counts.
#
# Runs on workflow_dispatch only. Delete this file after a green run.
# =============================================================================

name: Probe portal events endpoint (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          npx --yes @insforge/cli link \
            --api-base-url https://yj675q8e.ap-southeast.insforge.app \
            --api-key "$INSFORGE_API_KEY" --guard off --json
          test -s .insforge/project.json

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Fetch the Postgres DSN (value never echoed)
        id: dsn
        run: |
          set -euo pipefail
          dsn="$(npx --yes @insforge/cli --json db connection-string | jq -r '.connectionURL // empty')"
          [ -n "$dsn" ] || { echo "::error::could not fetch the database connection string"; exit 1; }
          echo "::add-mask::$dsn"
          echo "dsn=$dsn" >> "$GITHUB_OUTPUT"

      - name: Seed probe-id sentinels (cleanup must run even on failure)
        run: |
          { echo "CID=0"; echo "LID=0"; echo "EID=0"; } >> "$GITHUB_ENV"

      - name: Probe the events surface over HTTPS
        id: probe
        env:
          PROD: https://yj675q8e.ap-southeast.insforge.app
        run: |
          set -euo pipefail
          tok="$(curl -sf -X POST "$PROD/api/login" -H 'Content-Type: application/json' \
            -d '{"email":"admin@labcare.com","password":"Demo123!"}' | jq -r .token)"
          echo "::notice::login OK"

          code="$(curl -s -o /dev/null -w '%{http_code}' "$PROD/api/portal/deadbeef0000/events")"
          [ "$code" = "404" ] || { echo "::error::unknown portal token must 404, got $code"; exit 1; }
          echo "::notice::unknown portal token -> 404 (route deployed)"

          cid="$(curl -sf -X POST "$PROD/api/customers" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' -d '{"name":"Siren Probe Clinic"}' | jq -r .id)"
          echo "CID=$cid" >> "$GITHUB_ENV"

          link_json="$(curl -sf -X POST "$PROD/api/portal-links" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' -d "{\"customer_id\": $cid, \"label\": \"siren probe\"}")"
          ptok="$(echo "$link_json" | jq -r .token)"
          lid="$(echo "$link_json" | jq -r .id)"
          echo "LID=$lid" >> "$GITHUB_ENV"

          cmp_json="$(curl -sf -X POST "$PROD/api/portal/$ptok/complaints" -H 'Content-Type: application/json' \
            -d '{"kind":"complaint","name":"Probe","phone":"0123456789","subject":"siren probe","priority":"low"}')"
          eid="$(echo "$cmp_json" | jq -r .id)"
          echo "EID=$eid" >> "$GITHUB_ENV"
          echo "::notice::probe complaint $(echo "$cmp_json" | jq -r .code) created via portal"

          seed="$(curl -sf "$PROD/api/portal/$ptok/events" | jq -r .latest_id)"
          n_own="$(curl -sf "$PROD/api/portal/$ptok/events?since_id=$seed" | jq '.events | length')"
          [ "$n_own" = "0" ] || { echo "::error::reporter's own submission must be silent"; exit 1; }
          echo "::notice::reporter's own submission silent OK (seed=$seed)"

          curl -sf -X POST "$PROD/api/comments" -H "Authorization: Bearer $tok" \
            -H 'Content-Type: application/json' \
            -d "{\"entity_type\":\"complaint\",\"entity_id\":$eid,\"text\":\"Probe reply from staff.\"}" > /dev/null

          ev1="$(curl -sf "$PROD/api/portal/$ptok/events?since_id=$seed")"
          n1="$(echo "$ev1" | jq '.events | length')"
          [ "$n1" -ge 1 ] || { echo "::error::staff comment must surface; got $ev1"; exit 1; }
          echo "$ev1" | jq -e '.events[] | select(.action=="comment" and (.detail | contains("Probe reply")))' > /dev/null \
            || { echo "::error::comment event malformed: $ev1"; exit 1; }
          echo "::notice::staff comment surfaced OK ($n1 event(s))"

          n_quiet="$(curl -sf "$PROD/api/portal/$ptok/events?since_id=$(echo "$ev1" | jq -r .latest_id)" | jq '.events | length')"
          [ "$n_quiet" = "0" ] || { echo "::error::feed must be quiet with nothing new"; exit 1; }
          echo "::notice::quiet-when-nothing-new OK"

      - name: Cleanup — remove every probe row (owner role)
        if: always()
        env:
          DSN: ${{ steps.dsn.outputs.dsn }}
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 <<SQL
          DELETE FROM comments      WHERE entity_type='complaint' AND entity_id=$EID;
          DELETE FROM notifications WHERE entity_type='complaint' AND entity_id=$EID;
          DELETE FROM audit_logs    WHERE (entity_type='complaint' AND entity_id=$EID)
                                     OR (entity_type='customer'  AND entity_id=$CID);
          DELETE FROM portal_links  WHERE id=$LID;
          DELETE FROM complaints    WHERE id=$EID;
          DELETE FROM customers     WHERE id=$CID;
          DELETE FROM sessions      WHERE user_id=1;
          SQL
          echo "::notice::probe rows removed"

      - name: Verify — production back to master-only
        env:
          DSN: ${{ steps.dsn.outputs.dsn }}
        if: always()
        run: |
          set -euo pipefail
          counts="$(psql "$DSN" -tA <<SQL
          SELECT 'users='||count(*) FROM users
          UNION ALL SELECT 'customers='||count(*) FROM customers
          UNION ALL SELECT 'portal_links='||count(*) FROM portal_links
          UNION ALL SELECT 'complaints='||count(*) FROM complaints
          SQL
          )"
          echo "::notice title=row counts::$(echo "$counts" | tr '\n' ' ')"
          [ "$(psql "$DSN" -tAc 'SELECT count(*) FROM users')" = "1" ]
