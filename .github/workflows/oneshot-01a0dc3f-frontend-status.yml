# =============================================================================
# ONE-SHOT — publish the pending frontend fix and report production status.
#
# Why: the login-screen fix merged as PR #9 (static/index.html + static/app.js)
# never reached production. Its deploy run (36220403075) was cancelled at the
# backend health check, so the "Deploy frontend" step it owned was skipped, and
# the last successful deploy (36218954379, 04:49Z) predates the fix.
#
# PR #9 touched only static/ files, so this is the documented frontend-only
# recovery path (README → "Frontend-only recovery deployment"): publish the
# static app, leave compute and the database untouched (no container restart,
# no database.py migrations against live data).
#
# The coding sandbox cannot reach InsForge/Fly.io (egress firewall), hence a
# runner-side workflow. Delete this file once it has served its purpose.
# =============================================================================

name: One-shot — frontend deploy + production status

on:
  push:
    branches: ['arena/01a0dc3f-labcare']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneshot-frontend-01a0dc3f
  cancel-in-progress: false

env:
  SITE_URL: https://labcare.insforge.site
  BACKEND_ENDPOINT: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev
  API_BASE_URL: https://yj675q8e.ap-southeast.insforge.app

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend startup regression tests
        run: node --test scripts/test_frontend_startup.js

      - name: Status before — frontend markers and backend health
        run: |
          set -uo pipefail
          echo "· live index.html:"
          curl -fsS -m 30 "$SITE_URL/" -o /tmp/before_index.html \
            && { echo "    bytes: $(wc -c < /tmp/before_index.html)";
                 if grep -q 'id="startupRetry"' /tmp/before_index.html; then
                   echo "    startupRetry button: PRESENT (fix already live)";
                 else
                   echo "    startupRetry button: absent (fix not live yet)"; fi; } \
            || echo "    index.html fetch failed"
          echo "· live app.js?v=49.1:"
          curl -fsS -m 30 "$SITE_URL/app.js?v=49.1" -o /tmp/before_app.js \
            && { echo "    bytes: $(wc -c < /tmp/before_app.js)";
                 if grep -q 'startupRetry' /tmp/before_app.js; then
                   echo "    boot() retry wiring: PRESENT (fix already live)";
                 else
                   echo "    boot() retry wiring: absent (fix not live yet)"; fi; } \
            || echo "    app.js fetch failed"
          echo "· backend /api/health:"
          code="$(curl -sS -m 45 -o /tmp/health.txt -w '%{http_code}' "$BACKEND_ENDPOINT/api/health" 2>/tmp/health.err)" \
            && echo "    http $code — $(head -c 300 /tmp/health.txt)" \
            || { echo "    curl failed (exit $?): $(head -c 300 /tmp/health.err)"; }

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          if [ -z "${INSFORGE_API_KEY:-}" ]; then
            echo "::error title=Missing repository secret::INSFORGE_API_KEY is not set — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx --yes @insforge/cli link \
            --api-base-url "$API_BASE_URL" --api-key "$INSFORGE_API_KEY" --guard off --json
          test -s .insforge/project.json

      - name: Deploy frontend (InsForge hosting) — static only
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: npx --yes @insforge/cli deployments deploy static

      - name: Verify the fix is live
        run: |
          set -uo pipefail
          ok=0
          curl -fsS -m 30 "$SITE_URL/app.js?v=49.1" -o /tmp/after_app.js \
            && { echo "app.js bytes: $(wc -c < /tmp/after_app.js)";
                 grep -q 'startupRetry' /tmp/after_app.js \
                   && { echo "  ✓ app.js carries the boot() retry wiring"; ok=$((ok+1)); } \
                   || echo "  ✗ app.js is still the pre-fix bundle"; } \
            || echo "  ✗ app.js fetch failed"
          curl -fsS -m 30 "$SITE_URL/" -o /tmp/after_index.html \
            && { echo "index.html bytes: $(wc -c < /tmp/after_index.html)";
                 grep -q 'id="startupRetry"' /tmp/after_index.html \
                   && { echo "  ✓ index.html carries the startupRetry button"; ok=$((ok+1)); } \
                   || echo "  ✗ index.html is still the pre-fix shell"; } \
            || echo "  ✗ index.html fetch failed"
          [ "$ok" -eq 2 ] || { echo "::error::frontend verification failed"; exit 1; }
          echo "frontend live with the startup fix — $SITE_URL"

      - name: Status after — backend health (advisory, not part of this deploy)
        if: always()
        run: |
          set -uo pipefail
          echo "· backend /api/health:"
          code="$(curl -sS -m 45 -o /tmp/health2.txt -w '%{http_code}' "$BACKEND_ENDPOINT/api/health" 2>/tmp/health2.err)" \
            && echo "    http $code — $(head -c 300 /tmp/health2.txt)" \
            || { echo "    curl failed (exit $?): $(head -c 300 /tmp/health2.err)"; }
          echo "· /api/version:"
          code="$(curl -sS -m 45 -o /tmp/ver.txt -w '%{http_code}' "$BACKEND_ENDPOINT/api/version" 2>/tmp/ver.err)" \
            && echo "    http $code — $(head -c 300 /tmp/ver.txt)" \
            || { echo "    curl failed (exit $?): $(head -c 300 /tmp/ver.err)"; }
