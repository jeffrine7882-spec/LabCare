# =============================================================================
# ONE-SHOT — production probe. Answers "is what is deployed actually healthy?"
# from a runner, because the coding sandbox has no egress to InsForge/Fly.io.
#
# Results are emitted as check-run annotations (title prefix LABPROBE) so they
# can be read back over the API without log access. This workflow deploys
# nothing and changes nothing. Delete once it has served its purpose.
# =============================================================================

name: One-shot — production probe

on:
  push:
    branches: ['arena/01a0dc3f-labcare']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneshot-probe-01a0dc3f
  cancel-in-progress: false

env:
  SITE_URL: https://labcare.insforge.site
  BACKEND_ENDPOINT: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the live frontend
        run: |
          set -uo pipefail
          code="$(curl -sS -m 30 -o /tmp/idx.html -w '%{http_code}' "$SITE_URL/" 2>/dev/null)" || code="ERR$?"
          bytes="$(wc -c < /tmp/idx.html 2>/dev/null || echo 0)"
          marker="absent"; grep -q 'id="startupRetry"' /tmp/idx.html 2>/dev/null && marker="present"
          echo "::notice title=LABPROBE_FRONTEND_INDEX::http=$code bytes=$bytes startupRetry_button=$marker"
          code="$(curl -sS -m 30 -o /tmp/app.js -w '%{http_code}' "$SITE_URL/app.js?v=49.1" 2>/dev/null)" || code="ERR$?"
          bytes="$(wc -c < /tmp/app.js 2>/dev/null || echo 0)"
          marker="absent"; grep -q 'startupRetry' /tmp/app.js 2>/dev/null && marker="present"
          echo "::notice title=LABPROBE_FRONTEND_APPJS::http=$code bytes=$bytes boot_retry_wiring=$marker"

      - name: Probe the backend API directly (compute container)
        run: |
          set -uo pipefail
          t0=$(date +%s)
          code="$(curl -sS -m 60 -o /tmp/health -w '%{http_code}' "$BACKEND_ENDPOINT/api/health" 2>/tmp/health.err)" || code="ERR$?"
          t1=$(date +%s)
          body="$(tr -d '\n\r' < /tmp/health 2>/dev/null | head -c 200)"
          [ -n "$body" ] || body="$(tr -d '\n\r' < /tmp/health.err 2>/dev/null | head -c 200)"
          echo "::notice title=LABPROBE_BACKEND_HEALTH::http=$code seconds=$((t1-t0)) body=$body"
          code="$(curl -sS -m 60 -o /tmp/version -w '%{http_code}' "$BACKEND_ENDPOINT/api/version" 2>/tmp/version.err)" || code="ERR$?"
          body="$(tr -d '\n\r' < /tmp/version 2>/dev/null | head -c 200)"
          [ -n "$body" ] || body="$(tr -d '\n\r' < /tmp/version.err 2>/dev/null | head -c 200)"
          echo "::notice title=LABPROBE_BACKEND_VERSION::http=$code body=$body"

      - name: Probe the API through the site (the path the browser uses)
        run: |
          set -uo pipefail
          for path in /api/health /api/version; do
            code="$(curl -sS -m 60 -o /tmp/proxy -w '%{http_code}' "$SITE_URL$path" 2>/tmp/proxy.err)" || code="ERR$?"
            body="$(tr -d '\n\r' < /tmp/proxy 2>/dev/null | head -c 200)"
            [ -n "$body" ] || body="$(tr -d '\n\r' < /tmp/proxy.err 2>/dev/null | head -c 200)"
            echo "::notice title=LABPROBE_SITE_PROXY::$path http=$code body=$body"
          done
          echo "::notice title=LABPROBE_DONE::probe complete — see the four notices above"
