# =============================================================================
# ONE-SHOT — diagnose the API outage and try to restore it.
#
# Context: the compute service labcare-api answers 503 (proxy timeout) and 502
# since the 05:05Z deploy; its health check then hung for 30 minutes and the run
# was cancelled, which is also why PR #9's frontend fix never shipped.
#
# Hypothesis: server/run.py calls init_db() unguarded, and _pg_migrate() drops
# and re-adds users_role_check / onboarding_apps_role_check on EVERY boot,
# validating all existing rows. One live row with a role outside
# (admin|engineer|application|customer) makes init_db() raise, the container
# exits, and the Fly proxy has nothing to route to. This workflow reads the live
# data (read-only) and the machine events, then attempts the cheap recovery
# (compute start — no rebuild) and re-probes health.
#
# Nothing here writes application data. Results are emitted as check-run
# annotations (titles LABDIAG_* / LABFIX_*) so they can be read back over the
# API without log access. Delete once it has served its purpose.
# =============================================================================

name: One-shot — diagnose and restore the API

on:
  push:
    branches: ['arena/01a0dc3f-labcare']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneshot-restore-01a0dc3f
  cancel-in-progress: false

env:
  SITE_URL: https://labcare.insforge.site
  BACKEND_ENDPOINT: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev
  API_BASE_URL: https://yj675q8e.ap-southeast.insforge.app
  SERVICE_NAME: labcare-api

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          if [ -z "${INSFORGE_API_KEY:-}" ]; then
            echo "::error title=Missing repository secret::INSFORGE_API_KEY is not set."
            exit 1
          fi
          npx --yes @insforge/cli link \
            --api-base-url "$API_BASE_URL" --api-key "$INSFORGE_API_KEY" --guard off --json

      - name: Service state and machine events
        run: |
          set -uo pipefail
          emit() { # emit <title> <file>
            local title="$1" f="$2" n=0 text chunk
            text="$(tr '\n\r\t' '   ' < "$f" 2>/dev/null | sed 's/  */ /g' | cut -c1-18000)"
            while [ -n "$text" ] && [ "$n" -lt 12 ]; do
              chunk="$(printf '%s' "$text" | cut -c1-1200)"
              echo "::notice title=${title}_${n}::${chunk}"
              text="$(printf '%s' "$text" | cut -c1201-18000)"
              n=$((n+1))
            done
          }
          npx --yes @insforge/cli --json compute list > /tmp/services.json 2>&1 || true
          emit LABDIAG_SERVICES /tmp/services.json
          id="$(jq -r '(.services // .data // .) | if type=="array" then .[] else . end | select((.name // .serviceName // "")=="'"$SERVICE_NAME"'") | (.id // .serviceId // .name) ' /tmp/services.json 2>/dev/null | head -n1)"
          echo "resolved service id: ${id:-<none>}"
          echo "::notice title=LABDIAG_SERVICE_ID::id=${id:-none}"
          if [ -n "${id:-}" ] && [ "$id" != "null" ]; then
            npx --yes @insforge/cli --json compute get "$id" > /tmp/service.json 2>&1 || true
            emit LABDIAG_SERVICE_GET /tmp/service.json
            npx --yes @insforge/cli --json compute events "$id" > /tmp/events.json 2>&1 || true
            emit LABDIAG_SERVICE_EVENTS /tmp/events.json
          fi
          echo "$id" > /tmp/service_id

      - name: Live data that would break the boot-time role constraints
        run: |
          set -uo pipefail
          emit() {
            local title="$1" f="$2" n=0 text chunk
            text="$(tr '\n\r\t' '   ' < "$f" 2>/dev/null | sed 's/  */ /g' | cut -c1-9000)"
            while [ -n "$text" ] && [ "$n" -lt 8 ]; do
              chunk="$(printf '%s' "$text" | cut -c1-1200)"
              echo "::notice title=${title}_${n}::${chunk}"
              text="$(printf '%s' "$text" | cut -c1201-9000)"
              n=$((n+1))
            done
          }
          q() { # q <label> <sql>
            npx --yes @insforge/cli --json db query "$2" > "/tmp/q_$1.json" 2>&1 || true
            emit "LABDIAG_DB_$1" "/tmp/q_$1.json"
          }
          q USERS_ROLES "SELECT role, count(*) AS n FROM users GROUP BY role ORDER BY n DESC"
          q APPS_ROLES "SELECT role, count(*) AS n FROM onboarding_apps GROUP BY role ORDER BY n DESC"
          q OUT_OF_SET_USERS "SELECT id, email, role FROM users WHERE role NOT IN ('admin','engineer','application','customer')"
          q OUT_OF_SET_APPS "SELECT id, email, role FROM onboarding_apps WHERE role NOT IN ('engineer','application','customer')"
          q DUP_SERIALS "SELECT serial_number, count(*) AS n FROM equipment WHERE serial_number IS NOT NULL AND serial_number <> '' GROUP BY serial_number HAVING count(*) > 1"
          q COUNTRIES "SELECT count(*) AS users, (SELECT count(*) FROM complaints) AS complaints, (SELECT count(*) FROM breakdowns) AS breakdowns, (SELECT count(*) FROM equipment) AS equipment FROM users"

      - name: Recovery attempt — start the stopped service (no rebuild)
        run: |
          set -uo pipefail
          id="$(cat /tmp/service_id 2>/dev/null || true)"
          if [ -z "${id:-}" ] || [ "$id" = "null" ]; then
            echo "::warning title=LABFIX_SKIP::no service id resolved — cannot attempt a start"
            exit 0
          fi
          npx --yes @insforge/cli --yes --reason "LabCare API is down (503); restarting the existing compute service, no image rebuild" \
            --impact "Restores the API for all users; the container re-runs its idempotent boot migrations as it does on any start" \
            --recommendation "Start the existing service first; only rebuild if it fails to become healthy" \
            compute start "$id" > /tmp/start.txt 2>&1 || true
          tr '\n\r' '  ' < /tmp/start.txt | sed 's/  */ /g' | cut -c1-1200 | awk '{print "::notice title=LABFIX_START::" $0}'
          echo "waiting up to 4 minutes for the API to answer…"
          ok=0
          for i in $(seq 1 16); do
            code="$(curl -sS -m 20 -o /tmp/h.json -w '%{http_code}' "$BACKEND_ENDPOINT/api/health" 2>/dev/null)" || code="ERR"
            if [ "$code" = "200" ]; then ok=1; echo "healthy after $((i*15))s: $(tr -d '\n' < /tmp/h.json | head -c 200)"; break; fi
            echo "  attempt $i: http=$code"; sleep 15
          done
          echo "::notice title=LABFIX_HEALTH::direct_api_health_200=$ok last_http=$code"
          code2="$(curl -sS -m 20 -o /tmp/h2.json -w '%{http_code}' "$SITE_URL/api/health" 2>/dev/null)" || code2="ERR"
          echo "::notice title=LABFIX_HEALTH_PROXY::site_api_health_http=$code2 body=$(tr -d '\n' < /tmp/h2.json 2>/dev/null | head -c 200)"
          code3="$(curl -sS -m 20 -o /tmp/v.json -w '%{http_code}' "$BACKEND_ENDPOINT/api/version" 2>/dev/null)" || code3="ERR"
          echo "::notice title=LABFIX_VERSION::http=$code3 body=$(tr -d '\n' < /tmp/v.json 2>/dev/null | head -c 200)"
