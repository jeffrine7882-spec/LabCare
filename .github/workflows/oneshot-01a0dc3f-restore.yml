# =============================================================================
# ONE-SHOT — reproduce the container boot, then restore the API.
#
# Evidence so far: compute service labcare-api reports status "running" but its
# machine (e820549f04ee38) is in a restart loop — "[flyd] exit: stopped" then
# "[flyd] start: started" every few seconds — and the proxy answers 503/502.
# The live database is clean and tiny (2 admin users, no tickets, no equipment,
# no out-of-set roles), so the boot-time migrations are not what kills it.
#
# Before shipping a new revision, this run proves the code + live DSN actually
# boot together, on the runner, where a traceback is visible:
#   1. fetch the DSN exactly as the deploy does
#   2. pip install the same requirements
#   3. run init_db() against the live Postgres  -> INIT_DB_OK or a traceback
#   4. start the real app locally and curl /api/health + /api/version
#   5. only if 3 and 4 pass: compute deploy (fresh image, fresh env), then the
#      health checks that the cancelled 05:05Z run never reached
#
# Results are emitted as check-run annotations (titles LABBOOT_* / LABDEPLOY_*)
# so they can be read back over the API without log access.
# =============================================================================

name: One-shot — reproduce boot and restore the API

on:
  push:
    branches: ['arena/01a0dc3f-labcare']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneshot-restore-01a0dc3f
  cancel-in-progress: false

env:
  SITE_URL: https://labcare.insforge.site
  BACKEND_ENDPOINT: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev
  API_BASE_URL: https://yj675q8e.ap-southeast.insforge.app
  SERVICE_NAME: labcare-api
  SERVICE_PORT: "8000"
  FLY_REGION: sin

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          set +e
          if [ -z "${INSFORGE_API_KEY:-}" ]; then
            echo "::error title=Missing repository secret::INSFORGE_API_KEY is not set."
            exit 1
          fi
          npx --yes @insforge/cli link \
            --api-base-url "$API_BASE_URL" --api-key "$INSFORGE_API_KEY" --guard off --json

      - name: Fetch the DSN and write .env.production (never echoed)
        run: |
          set +e
          dsn="$(npx --yes @insforge/cli --json db connection-string | jq -r '.connectionURL // empty')"
          if [ -z "$dsn" ]; then echo "::error::could not fetch the database connection string"; exit 1; fi
          {
            echo "LABCARE_DATABASE_URL=$dsn"
            echo "LABCARE_SECURE_COOKIES=1"
            echo "LABCARE_PORTAL_URL=$SITE_URL"
            echo "LABCARE_APP_URL=$SITE_URL"
          } > .env.production
          # Shape only — credentials stripped, so the form can be compared.
          echo "::notice title=LABBOOT_DSN_SHAPE::masked=$(printf '%s' "$dsn" | sed -E 's#://[^:]+:[^@]*@#://***:***@#') len=${#dsn}"
          echo "wrote .env.production ($(wc -l < .env.production) entries; contents not echoed)"

      - name: Install the app's requirements
        run: pip install --quiet -r requirements.txt

      - name: Reproduce the container boot against the live Postgres
        run: |
          set +e
          emit() {
            local title="$1" f="$2" n=0 text chunk
            text="$(tr '\n\r\t' '   ' < "$f" 2>/dev/null | sed 's/  */ /g' | cut -c1-9000)"
            while [ -n "$text" ] && [ "$n" -lt 8 ]; do
              chunk="$(printf '%s' "$text" | cut -c1-1200)"
              echo "::notice title=${title}_${n}::${chunk}"
              text="$(printf '%s' "$text" | cut -c1201-9000)"
              n=$((n+1))
            done
          }
          set -a; . ./.env.production; set +a
          python3 --version > /tmp/boot.log 2>&1
          ( cd server && python3 -c "import database; print('PG_ENABLED=', database.PG_ENABLED); database.init_db(); print('INIT_DB_OK')" ) >> /tmp/boot.log 2>&1
          rc=$?
          emit LABBOOT_INIT_DB /tmp/boot.log
          echo "init_db exit code: $rc"
          echo "::notice title=LABBOOT_INIT_DB_RESULT::exit=$rc $(grep -c INIT_DB_OK /tmp/boot.log >/dev/null && grep -q INIT_DB_OK /tmp/boot.log && echo RESULT=INIT_DB_OK || echo RESULT=FAILED)"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=LABBOOT_ABORT::init_db failed — not deploying; the traceback above is the cause"
            exit 0
          fi
          # Now the real entry point, exactly as the container runs it.
          ( cd server && LABCARE_DATABASE_URL="${LABCARE_DATABASE_URL}" PORT=8011 nohup python3 run.py > /tmp/app.log 2>&1 & )
          for i in $(seq 1 15); do
            code="$(curl -sS -m 5 -o /tmp/local.json -w '%{http_code}' http://127.0.0.1:8011/api/health 2>/dev/null)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "::notice title=LABBOOT_LOCAL_APP::health_http=${code:-ERR} body=$(tr -d '\n' < /tmp/local.json 2>/dev/null | head -c 200)"
          code="$(curl -sS -m 10 -o /tmp/localv.json -w '%{http_code}' http://127.0.0.1:8011/api/version 2>/dev/null)"
          echo "::notice title=LABBOOT_LOCAL_VERSION::http=${code:-ERR} body=$(tr -d '\n' < /tmp/localv.json 2>/dev/null | head -c 200)"
          emit LABBOOT_APP_LOG /tmp/app.log
          echo "boot_repro_ok=$([ "${code:-ERR}" = "200" ] && echo yes || echo no)" > /tmp/boot_repro

      - name: Install flyctl (needed for the compute source build)
        run: |
          curl -fsSL https://fly.io/install.sh -o /tmp/fly_install.sh
          FLYCTL_INSTALL="$HOME/.fly" sh /tmp/fly_install.sh >/dev/null
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy the API (fresh image + fresh env)
        run: |
          set +e
          if ! grep -q 'boot_repro_ok=yes' /tmp/boot_repro; then
            echo "::warning title=LABDEPLOY_SKIPPED::the boot reproduction did not pass — deploy skipped"
            exit 0
          fi
          npx --yes @insforge/cli compute deploy . \
            --name "$SERVICE_NAME" --port "$SERVICE_PORT" --region "$FLY_REGION" \
            --env-file .env.production --always-on > /tmp/deploy.log 2>&1
          rc=$?
          echo "compute deploy exit code: $rc"
          tail -c 3500 /tmp/deploy.log > /tmp/deploy_tail.log
          tr '\n\r\t' '   ' < /tmp/deploy_tail.log | sed 's/  */ /g' | cut -c1-1200 | awk '{print "::notice title=LABDEPLOY_LOG::" $0}'
          echo "::notice title=LABDEPLOY_EXIT::exit=$rc"

      - name: Wait for the API to answer, then verify
        run: |
          set +e
          ok=0
          for i in $(seq 1 40); do
            code="$(curl -sS -m 25 -o /tmp/h.json -w '%{http_code}' "$BACKEND_ENDPOINT/api/health" 2>/dev/null)"
            if [ "$code" = "200" ]; then ok=1; echo "healthy on attempt $i"; break; fi
            echo "  attempt $i: http=${code:-ERR}"; sleep 15
          done
          body="$(tr -d '\n\r' < /tmp/h.json 2>/dev/null | head -c 220)"
          echo "::notice title=LABDEPLOY_HEALTH::http=${code:-ERR} healthy=$ok body=$body"
          vcode="$(curl -sS -m 25 -o /tmp/v.json -w '%{http_code}' "$BACKEND_ENDPOINT/api/version" 2>/dev/null)"
          echo "::notice title=LABDEPLOY_VERSION::http=${vcode:-ERR} body=$(tr -d '\n\r' < /tmp/v.json 2>/dev/null | head -c 220)"
          pcode="$(curl -sS -m 25 -o /tmp/p.json -w '%{http_code}' "$SITE_URL/api/health" 2>/dev/null)"
          echo "::notice title=LABDEPLOY_SITE_PROXY::http=${pcode:-ERR} body=$(tr -d '\n\r' < /tmp/p.json 2>/dev/null | head -c 220)"
