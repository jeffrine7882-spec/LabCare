# =============================================================================
# ONE-SHOT — diagnose the API outage (read-only, changes nothing).
#
# Context: compute service labcare-api reports status "running" (machine
# e820549f04ee38, region sin, updated 05:06Z) yet the API answers 503 (proxy
# timeout, ~55s) and 502. Boot calls init_db() unguarded in server/run.py, and
# _pg_migrate() drops and re-adds users_role_check / onboarding_apps_role_check
# on EVERY boot, validating all existing rows — one out-of-set role value makes
# init_db() raise, the container exits, and nothing is left to route to.
#
# This run only reads: machine events, service details, and live role/constraint
# data. Results are emitted as check-run annotations (title prefix LABDIAG) so
# they can be read back over the API without log access.
# =============================================================================

name: One-shot — diagnose the API outage

on:
  push:
    branches: ['arena/01a0dc3f-labcare']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneshot-restore-01a0dc3f
  cancel-in-progress: false

env:
  BACKEND_ENDPOINT: https://labcare-api-ee5bd3a7-8f78-4005-87ea-6c57ff5728aa.fly.dev
  SITE_URL: https://labcare.insforge.site
  API_BASE_URL: https://yj675q8e.ap-southeast.insforge.app
  SERVICE_NAME: labcare-api

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link the InsForge project (API-key auth, no OAuth)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          set +e
          if [ -z "${INSFORGE_API_KEY:-}" ]; then
            echo "::error title=Missing repository secret::INSFORGE_API_KEY is not set."
            exit 1
          fi
          npx --yes @insforge/cli link \
            --api-base-url "$API_BASE_URL" --api-key "$INSFORGE_API_KEY" --guard off --json

      - name: Machine events, service details and API probes
        run: |
          set +e
          emit() { # emit <title> <file>
            local title="$1" f="$2" n=0 text chunk
            text="$(tr '\n\r\t' '   ' < "$f" 2>/dev/null | sed 's/  */ /g' | cut -c1-18000)"
            while [ -n "$text" ] && [ "$n" -lt 12 ]; do
              chunk="$(printf '%s' "$text" | cut -c1-1200)"
              echo "::notice title=${title}_${n}::${chunk}"
              text="$(printf '%s' "$text" | cut -c1201-18000)"
              n=$((n+1))
            done
          }
          npx --yes @insforge/cli --json compute list > /tmp/services.json 2>&1
          id="$(jq -r 'if type=="array" then .[0].id else (.services // .data // [])[0].id end' /tmp/services.json 2>/dev/null)"
          [ -n "$id" ] && [ "$id" != "null" ] || id=""
          if [ -z "$id" ]; then
            id="$(grep -o '"id": *"[0-9a-f-]\{36\}"' /tmp/services.json | head -n1 | sed 's/.*"\([0-9a-f-]*\)"$/\1/')"
          fi
          echo "::notice title=LABDIAG_SERVICE_ID::id=${id:-none}"
          if [ -n "$id" ]; then
            npx --yes @insforge/cli --json compute get "$id" > /tmp/service.json 2>&1
            emit LABDIAG_SERVICE_GET /tmp/service.json
            npx --yes @insforge/cli --json compute events "$id" > /tmp/events.json 2>&1
            emit LABDIAG_EVENTS /tmp/events.json
          fi
          for path in /api/health /api/version; do
            t0=$(date +%s)
            code="$(curl -sS -m 70 -o /tmp/p.json -w '%{http_code}' "$BACKEND_ENDPOINT$path" 2>/dev/null)"
            t1=$(date +%s)
            echo "::notice title=LABDIAG_PROBE::${path} http=${code:-ERR} seconds=$((t1-t0)) body=$(tr -d '\n\r' < /tmp/p.json 2>/dev/null | head -c 220)"
          done

      - name: Live data that the boot-time role constraints validate
        run: |
          set +e
          emit() {
            local title="$1" f="$2" n=0 text chunk
            text="$(tr '\n\r\t' '   ' < "$f" 2>/dev/null | sed 's/  */ /g' | cut -c1-9000)"
            while [ -n "$text" ] && [ "$n" -lt 8 ]; do
              chunk="$(printf '%s' "$text" | cut -c1-1200)"
              echo "::notice title=${title}_${n}::${chunk}"
              text="$(printf '%s' "$text" | cut -c1201-9000)"
              n=$((n+1))
            done
          }
          q() { # q <label> <sql>
            npx --yes @insforge/cli --json db query "$2" > "/tmp/q_$1.json" 2>&1
            emit "LABDIAG_DB_$1" "/tmp/q_$1.json"
          }
          q USERS_ROLES "SELECT role, count(*) AS n FROM users GROUP BY role ORDER BY n DESC"
          q APPS_ROLES "SELECT role, count(*) AS n FROM onboarding_apps GROUP BY role ORDER BY n DESC"
          q OUT_OF_SET_USERS "SELECT id, email, role FROM users WHERE role NOT IN ('admin','engineer','application','customer')"
          q OUT_OF_SET_APPS "SELECT id, email, role FROM onboarding_apps WHERE role NOT IN ('engineer','application','customer')"
          q DUP_SERIALS "SELECT serial_number, count(*) AS n FROM equipment WHERE serial_number IS NOT NULL AND serial_number <> '' GROUP BY serial_number HAVING count(*) > 1"
          q TOTALS "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM complaints) AS complaints, (SELECT count(*) FROM breakdowns) AS breakdowns, (SELECT count(*) FROM equipment) AS equipment"
          q RLS "SELECT count(*) AS policies_on_users FROM pg_policies WHERE tablename IN ('users','complaints','breakdowns','equipment')"
          q ADVISORY "SELECT version() AS pg_version"
