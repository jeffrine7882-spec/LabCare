# =============================================================================
# LabCare — nginx reverse-proxy config for: labcareassist.netlify.app
#------------------------------------------------------------------------------
# The LabCare app (Flask + Waitress) listens on 127.0.0.1:8000 (see
# labcare.service). This file terminates HTTPS and proxies everything to it.
#
#   INSTALL
#     1. Copy:  sudo cp nginx-labcare.conf /etc/nginx/sites-available/labcare
#     2. Enable: sudo ln -s /etc/nginx/sites-available/labcare \
#                        /etc/nginx/sites-enabled/labcare
#     3. Test:   sudo nginx -t
#     4. Reload: sudo systemctl reload nginx
#
#   IMPORTANT NOTE ON THE HOSTNAME
#     labcareassist.netlify.app is a Netlify-managed hostname. You cannot point
#     its DNS at your own server's IP, and Let's Encrypt cannot issue a cert
#     for a *.netlify.app hostname (Netlify owns it). See deploy/DEPLOY.md for
#     the three workable setups:
#       (A) a domain you own  -> nginx + certbot (recommended, same file)
#       (B) host the frontend on Netlify and proxy /api here (netlify.toml)
#       (C) local/dev only    -> self-signed cert + /etc/hosts entry
#     For (C) generate a self-signed cert for this hostname:
#       sudo mkdir -p /etc/ssl/labcare && cd /etc/ssl/labcare
#       sudo openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#         -keyout privkey.pem -out fullchain.pem \
#         -subj "/CN=labcareassist.netlify.app"
#       (then use the "self-signed" cert paths block below instead)
# =============================================================================

# --- HTTP: redirect everything to HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name labcareassist.netlify.app;

    # ACME HTTP-01 challenge (for option A with your own domain)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS + reverse proxy to the app --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name labcareassist.netlify.app;

    # ------------------------------------------------------------------
    # TLS certificate.
    # Option A (own domain + Let's Encrypt) — generated automatically by:
    #     sudo certbot --nginx -d your.own.domain.com
    # Option C (local/self-signed) — comment A out and uncomment C.
    # ------------------------------------------------------------------
    # --- A: Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/labcareassist.netlify.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labcareassist.netlify.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/labcareassist.netlify.app/chain.pem;

    # --- C: self-signed (see header note) — uncomment to use
    # ssl_certificate     /etc/ssl/labcare/fullchain.pem;
    # ssl_certificate_key /etc/ssl/labcare/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (only with a real chain — remove if self-signed)
    ssl_stapling on;
    ssl_stapling_verify on;

    # Basic security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Attachment uploads go through the proxy — 8 MB files need headroom
    client_max_body_size 12m;

    # gzip for the single-page app + API JSON
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # longer timeout so PDF reports / CSV exports never get cut off
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Expose the app's own health probes (no auth required)
    location = /api/ping   { proxy_pass http://127.0.0.1:8000/api/ping; }
    location = /api/health { proxy_pass http://127.0.0.1:8000/api/health; }
}
