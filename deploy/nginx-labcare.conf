# =============================================================================
# LabSynch — nginx reverse-proxy config for the BACKEND
# -----------------------------------------------------------------------------
# The Flask/Waitress app listens on 127.0.0.1:8000 (see labcare.service /
# Docker). This file terminates HTTPS in front of it so the backend has a
# public HTTPS URL that Netlify's /api/* proxy can reach.
#
#   IMPORTANT — the server_name below MUST be a domain you own, NOT
#   labcareassist.netlify.app. Netlify owns every *.netlify.app hostname: you
#   cannot point its DNS at your VPS, and Let's Encrypt will not issue a cert
#   for it. Use e.g. api.labcare.mycompany.com and set its DNS A record to
#   your server's IP.
# =============================================================================

# --- HTTP: redirect everything to HTTPS + serve ACME challenge --------------
server {
    listen 80;
    listen [::]:80;
    server_name BACKEND-DOMAIN.example.com;   # <-- your own backend domain

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS + reverse proxy to the app ---------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name BACKEND-DOMAIN.example.com;   # <-- your own backend domain

    # certbot --nginx -d BACKEND-DOMAIN.example.com fills these in:
    ssl_certificate     /etc/letsencrypt/live/BACKEND-DOMAIN.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BACKEND-DOMAIN.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/BACKEND-DOMAIN.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (needs the real chain above)
    ssl_stapling on;
    ssl_stapling_verify on;

    # Basic security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body-size headroom for the proxy. Attachment uploads used to need 8 MB,
    # but that feature is gone — tickets now offer a generated Service Report
    # PDF instead — so this only covers ordinary JSON POSTs. Kept generous
    # rather than tightened, so a large comment or export filter never trips it.
    client_max_body_size 12m;

    # gzip for the app + API JSON
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # longer timeout so PDF reports / CSV exports never get cut off
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Expose the app's own health probes (no auth required)
    location = /api/ping   { proxy_pass http://127.0.0.1:8000/api/ping; }
    location = /api/health { proxy_pass http://127.0.0.1:8000/api/health; }
}
