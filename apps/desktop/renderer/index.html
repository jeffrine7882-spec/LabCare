<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabCare Alerts</title>
<style>
  :root { --teal:#0f766e; --teal-dark:#115e59; --ink:#111827; --soft:#6b7280; --bg:#f3f5f9; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; overflow:auto; }
  .wrap { padding:20px 18px; display:flex; flex-direction:column; min-height:100vh; }
  .brand { font-size:28px; font-weight:800; color:var(--teal); text-align:center; letter-spacing:.5px; }
  .tag { font-size:13px; color:var(--soft); text-align:center; margin:4px 0 14px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--soft); margin:12px 0 6px; font-weight:600; }
  input { width:100%; padding:12px; font-size:15px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { width:100%; padding:13px; font-size:14px; font-weight:700; border:0; border-radius:12px; cursor:pointer; color:#fff; margin-top:10px; }
  .primary { background:var(--teal); }
  .primary:disabled { opacity:.6; cursor:default; }
  .danger { background:#dc2626; }
  .err { color:#dc2626; font-size:13px; margin-top:4px; }
  .muted { color:var(--soft); font-size:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .pill { background:#c7f2ec; color:var(--teal-dark); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px; }
  .foot { margin-top:auto; text-align:center; font-size:12px; color:var(--soft); padding-top:14px; line-height:1.6; }
  .tabbar { display:flex; gap:6px; margin-bottom:14px; }
  .tab { flex:1; text-align:center; font-size:13px; font-weight:700; padding:9px 0; border-radius:10px; color:var(--teal); background:#e2f2f0; cursor:pointer; border:0; }
  .tab.active { background:var(--teal); color:#fff; }
  .notif { padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .notif:last-child { border-bottom:0; }
  .notif .t { font-size:14px; line-height:1.35; }
  .notif.unread .t { font-weight:700; color:var(--ink); }
  .notif.read .t { font-weight:400; color:var(--soft); }
  .notif .m { font-size:12px; color:#94a3b8; margin-top:3px; }
  .dot { color:var(--teal); font-weight:800; margin-right:6px; }
  .sound-opt { display:flex; align-items:center; gap:10px; padding:9px 0; cursor:pointer; }
  .sound-opt input { width:auto; margin:0; accent-color:var(--teal); }
  .empty { text-align:center; color:var(--soft); font-size:14px; padding:18px 0; }
  .hdr-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .linkbtn { background:none; border:0; color:var(--teal); font-weight:700; font-size:13px; cursor:pointer; width:auto; margin:0; padding:0; }
</style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script>
    const L = window.labcare;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function tabbar(active) {
      const tabs = [["home","Home"],["notifs","Notifications"],["sound","Sound"]];
      return `<div class="tabbar">` + tabs.map(([k,label]) =>
        `<button class="tab ${k===active?"active":""}" onclick="show('${k}')">${label}</button>`).join("") + `</div>`;
    }

    async function show(view) {
      const root = document.getElementById("root");
      if (view === "home") return home();
      if (view === "sound") return sound();
      if (view === "notifs") return notifs();
    }
    window.show = show;

    function home() {
      const root = document.getElementById("root");
      root.innerHTML = `
        <div class="brand">LabCare</div>
        <div class="tag">Desktop alerts</div>
        ${tabbar("home")}
        <div class="card">
          <div class="row"><span class="muted">Signed in as</span><span class="pill">● On</span></div>
          <div class="notif"><div class="t" style="font-weight:700">${esc(window.myName || "—")}</div></div>
        </div>
        <div class="card">
          <div class="notif"><div class="t">🔔 Rings for every new bell notification</div></div>
          <div class="notif"><div class="t">▶ Opens the web app when you click an alert</div></div>
          <div class="notif"><div class="t">🖥️ Lives in the system tray — close this window anytime</div></div>
          <div class="notif"><div class="t">🚀 Starts automatically with Windows</div></div>
        </div>
        <button class="danger" onclick="signOut()">Sign out</button>
        <div class="foot">You can close this window — LabCare keeps running in the tray.</div>
      `;
    }
    window.home = home;

    async function notifs() {
      const root = document.getElementById("root");
      root.innerHTML = `<div class="brand">LabCare</div><div class="tag">Notifications</div>${tabbar("notifs")}
        <div class="card"><div class="empty">Loading…</div></div><div class="foot"></div>`;
      const r = await L.listNotifs();
      const items = (r && r.ok) ? r.items : null;
      let body;
      if (!items) {
        body = `<div class="empty">Couldn't load notifications</div>`;
      } else if (!items.length) {
        body = `<div class="empty">You're all caught up 🎉</div>`;
      } else {
        body = `<div class="hdr-row"><span class="muted">Latest alerts</span><button class="linkbtn" onclick="markAll()">Mark all read</button></div>` +
          items.map((n) => `
            <div class="notif ${n.read ? "read" : "unread"}" onclick="mark(${n.id}, this)">
              <div class="t">${n.read ? "" : '<span class="dot">●</span>'}${esc(n.text)}</div>
              <div class="m">${esc(n.created_at || "")}</div>
            </div>`).join("");
      }
      root.innerHTML = `<div class="brand">LabCare</div><div class="tag">Notifications</div>${tabbar("notifs")}
        <div class="card">${body}</div>
        <div class="foot">Tap a notification to mark it read.</div>`;
    }
    window.notifs = notifs;

    async function mark(id, el) {
      await L.markRead(id);
      if (el) { el.classList.remove("unread"); el.classList.add("read"); }
    }
    window.mark = mark;

    async function markAll() {
      await L.markRead(null);
      notifs();
    }
    window.markAll = markAll;

    async function sound() {
      const current = await L.getSound();
      const root = document.getElementById("root");
      root.innerHTML = `<div class="brand">LabCare</div><div class="tag">Alert sound</div>${tabbar("sound")}
        <div class="card">
          <div class="muted" style="margin-bottom:4px">The sound this computer plays when a new alert arrives.</div>
          ${["chime","bell","beep","alarm"].map((id) => `
            <label class="sound-opt" onclick="pickSound('${id}')">
              <input type="radio" name="snd" value="${id}" ${current===id?"checked":""} onchange="pickSound('${id}')">
              <span style="font-size:14px;font-weight:600">${({chime:"Chime (default)",bell:"Bell",beep:"Triple beep",alarm:"Siren"})[id]}</span>
            </label>`).join("")}
        </div>
        <button class="primary" onclick="previewSound()">▶ Test sound</button>
        <div class="foot">The same sound is used for tray alerts.</div>`;
    }
    window.sound = sound;

    async function pickSound(id) {
      await L.setSound(id);
    }
    window.pickSound = pickSound;

    async function previewSound() {
      const current = await L.getSound();
      await L.testSound(current);
    }
    window.previewSound = previewSound;

    async function signOut() {
      await L.signOut();
      window.myName = "";
      loginScreen();
    }
    window.signOut = signOut;

    function loginScreen() {
      const root = document.getElementById("root");
      root.innerHTML = `
        <div class="brand">LabCare</div>
        <div class="tag">Windows desktop alerts — rings for every bell alert</div>
        <div class="card">
          <div class="err" id="err"></div>
          <label>Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button class="primary" id="btn">Sign in &amp; enable alerts</button>
        </div>
        <div class="foot">Uses the same account as the LabCare web app.<br>Runs in the system tray and starts with Windows.</div>
      `;
      document.getElementById("btn").addEventListener("click", async () => {
        const btn = document.getElementById("btn");
        btn.disabled = true; btn.textContent = "Signing in…";
        const r = await L.signIn(document.getElementById("email").value.trim(), document.getElementById("password").value);
        if (r && r.ok) { window.myName = r.name || ""; return home(); }
        if (r && r.pending) { document.getElementById("err").textContent = "Your account is awaiting administrator approval."; }
        else { document.getElementById("err").textContent = (r && r.error) ? r.error : "Sign in failed."; }
        btn.disabled = false; btn.textContent = "Sign in & enable alerts";
      });
    }

    (async () => {
      const s = await L.getState();
      if (s && s.signedIn) home();
      else loginScreen();
    })();
  </script>
</body>
</html>
