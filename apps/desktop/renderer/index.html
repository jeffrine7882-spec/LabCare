<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabSynch Alerts</title>
<style>
  :root { --brand:#b91c1c; --brand-dark:#7f1d1d; --ink:#111827; --soft:#6b7280; --bg:#f3f5f9; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; overflow:auto; }
  .wrap { padding:20px 18px; display:flex; flex-direction:column; min-height:100vh; }
  .brand { font-size:28px; font-weight:800; color:var(--brand); text-align:center; letter-spacing:.5px; }
  .tag { font-size:13px; color:var(--soft); text-align:center; margin:4px 0 14px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--soft); margin:12px 0 6px; font-weight:600; }
  input { width:100%; padding:12px; font-size:15px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { width:100%; padding:13px; font-size:14px; font-weight:700; border:0; border-radius:12px; cursor:pointer; color:#fff; margin-top:10px; }
  .primary { background:var(--brand); }
  .primary:disabled { opacity:.6; cursor:default; }
  .danger { background:#dc2626; }
  .ghost { background:#fee2e2; color:var(--brand-dark); }
  .err { color:#dc2626; font-size:13px; margin-top:4px; }
  .muted { color:var(--soft); font-size:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .pill { background:#fecaca; color:var(--brand-dark); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px; }
  .foot { margin-top:auto; text-align:center; font-size:12px; color:var(--soft); padding-top:14px; line-height:1.6; }
  .tabbar { display:flex; gap:4px; margin-bottom:14px; }
  .tab { flex:1; text-align:center; font-size:12px; font-weight:700; padding:9px 0; border-radius:10px; color:var(--brand); background:#fee2e2; cursor:pointer; border:0; margin:0; }
  .tab.active { background:var(--brand); color:#fff; }
  .notif { padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .notif:last-child { border-bottom:0; }
  .notif .t { font-size:14px; line-height:1.35; }
  .notif.unread .t { font-weight:700; color:var(--ink); }
  .notif.read .t { font-weight:400; color:var(--soft); }
  .notif .m { font-size:12px; color:#94a3b8; margin-top:3px; }
  .dot { color:var(--brand); font-weight:800; margin-right:6px; }
  .sound-opt { display:flex; align-items:center; gap:10px; padding:9px 0; cursor:pointer; }
  .sound-opt input { width:auto; margin:0; accent-color:var(--brand); }
  .empty { text-align:center; color:var(--soft); font-size:14px; padding:18px 0; }
  .hdr-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .linkbtn { background:none; border:0; color:var(--brand); font-weight:700; font-size:13px; cursor:pointer; width:auto; margin:0; padding:0; }
  .url { font-size:12px; color:#94a3b8; text-align:center; margin-top:8px; word-break:break-all; }
  /* The site link is a real <a> as well as a button, so it still works if the
     IPC bridge is unavailable — the window is never a dead end. */
  a.sitelink { display:block; width:100%; padding:13px; font-size:14px; font-weight:700;
               border-radius:12px; text-align:center; text-decoration:none;
               background:var(--brand); color:#fff; margin-top:10px; }
</style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script>
    const L = window.labcare;
    // Hardcoded on purpose: this is the last-resort link when the bridge is gone.
    const SITE = (L && L.siteUrl) || "https://labcare.insforge.site/";

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    /** Opens the LabSynch site in its own window, browser as the fallback. */
    async function openSite() {
      try {
        if (L && L.openSite) { const r = await L.openSite(); if (r && r.ok === false) return openSiteExternal(); return; }
      } catch (e) {}
      return openSiteExternal();
    }
    window.openSite = openSite;

    async function openSiteExternal() {
      try { if (L && L.openSiteExternal) return await L.openSiteExternal(); } catch (e) {}
      // No bridge at all: let the browser handle it (main process routes this).
      window.location.href = SITE;
    }
    window.openSiteExternal = openSiteExternal;

    function tabbar(active) {
      const tabs = [["home","Home"],["site","Site"],["notifs","Notifications"],["sound","Sound"]];
      return `<div class="tabbar">` + tabs.map(([k,label]) =>
        `<button class="tab ${k===active?"active":""}" onclick="show('${k}')">${label}</button>`).join("") + `</div>`;
    }

    async function show(view) {
      if (view === "home") return home();
      if (view === "site") return site();
      if (view === "sound") return sound();
      if (view === "notifs") return notifs();
    }
    window.show = show;

    function shell(title, tag, active, body, foot) {
      document.getElementById("root").innerHTML = `
        <div class="brand">LabSynch</div>
        <div class="tag">${esc(tag)}</div>
        ${tabbar(active)}
        ${body}
        <div class="foot">${foot || ""}</div>`;
    }

    function home() {
      shell("Home", "Desktop alerts", "home", `
        <div class="card">
          <div class="row"><span class="muted">Signed in as</span><span class="pill">● On</span></div>
          <div class="notif"><div class="t" style="font-weight:700">${esc(window.myName || window.myEmail || "—")}</div></div>
        </div>
        <a class="sitelink" href="${esc(SITE)}" target="_blank" rel="noopener"
           onclick="openSite(); return false;">🔬 Open the LabSynch site</a>
        <div class="card" style="margin-top:12px">
          <div class="notif"><div class="t">🔔 Rings for every new bell notification</div></div>
          <div class="notif"><div class="t">▶ Opens the web app when you click an alert</div></div>
          <div class="notif"><div class="t">🖥️ Lives in the system tray — close this window anytime</div></div>
          <div class="notif"><div class="t">🚀 Starts automatically with Windows</div></div>
        </div>
        <button class="danger" onclick="signOut()">Sign out</button>`,
        `You can close this window — LabSynch keeps running in the tray.`);
    }
    window.home = home;

    /** The Site tab: the LabSynch web app itself, opened inside this app. */
    function site() {
      shell("Site", "The LabSynch web app", "site", `
        <div class="card">
          <div class="notif"><div class="t">🔬 Complaints, breakdowns, equipment, PM and reports</div></div>
          <div class="notif"><div class="t">🔑 Opens signed in with this app's account</div></div>
        </div>
        <a class="sitelink" href="${esc(SITE)}" target="_blank" rel="noopener"
           onclick="openSite(); return false;">Open the LabSynch site</a>
        <button class="ghost" onclick="openSiteExternal()">Open in my web browser</button>
        <div class="url">${esc(SITE)}</div>`,
        `If the site window doesn't appear, use "Open in my web browser".`);
      openSite(); // opening the tab takes you straight there
    }
    window.site = site;

    async function notifs() {
      shell("Notifications", "Notifications", "notifs",
        `<div class="card"><div class="empty">Loading…</div></div>`, "");
      let r = null;
      try { r = await L.listNotifs(); } catch (e) { r = null; }
      const items = (r && r.ok) ? r.items : null;
      let body;
      if (!items) {
        body = `<div class="empty">Couldn't load notifications</div>`;
      } else if (!items.length) {
        body = `<div class="empty">You're all caught up 🎉</div>`;
      } else {
        body = `<div class="hdr-row"><span class="muted">Latest alerts</span><button class="linkbtn" onclick="markAll()">Mark all read</button></div>` +
          items.map((n) => `
            <div class="notif ${n.read ? "read" : "unread"}" onclick="mark(${n.id}, this)">
              <div class="t">${n.read ? "" : '<span class="dot">●</span>'}${esc(n.text)}</div>
              <div class="m">${esc(n.created_at || "")}</div>
            </div>`).join("");
      }
      shell("Notifications", "Notifications", "notifs", `<div class="card">${body}</div>`,
        `Tap a notification to mark it read.`);
    }
    window.notifs = notifs;

    async function mark(id, el) {
      try { await L.markRead(id); } catch (e) {}
      if (el) { el.classList.remove("unread"); el.classList.add("read"); }
    }
    window.mark = mark;

    async function markAll() {
      try { await L.markRead(null); } catch (e) {}
      notifs();
    }
    window.markAll = markAll;

    async function sound() {
      let current = "chime";
      try { current = await L.getSound(); } catch (e) {}
      shell("Sound", "Alert sound", "sound", `
        <div class="card">
          <div class="muted" style="margin-bottom:4px">The sound this computer plays when a new alert arrives.</div>
          ${["chime","bell","beep","alarm"].map((id) => `
            <label class="sound-opt" onclick="pickSound('${id}')">
              <input type="radio" name="snd" value="${id}" ${current===id?"checked":""} onchange="pickSound('${id}')">
              <span style="font-size:14px;font-weight:600">${({chime:"Chime (default)",bell:"Bell",beep:"Triple beep",alarm:"Siren"})[id]}</span>
            </label>`).join("")}
        </div>
        <button class="primary" onclick="previewSound()">▶ Test sound</button>`,
        `The same sound is used for tray alerts.`);
    }
    window.sound = sound;

    async function pickSound(id) {
      try { await L.setSound(id); } catch (e) {}
    }
    window.pickSound = pickSound;

    async function previewSound() {
      let current = "chime";
      try { current = await L.getSound(); } catch (e) {}
      try { await L.testSound(current); } catch (e) {}
    }
    window.previewSound = previewSound;

    async function signOut() {
      try { await L.signOut(); } catch (e) {}
      window.myName = "";
      window.myEmail = "";
      loginScreen();
    }
    window.signOut = signOut;

    function loginScreen() {
      document.getElementById("root").innerHTML = `
        <div class="brand">LabSynch</div>
        <div class="tag">Windows desktop alerts — rings for every bell alert</div>
        <div class="card">
          <div class="err" id="err"></div>
          <label>Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button class="primary" id="btn">Sign in &amp; enable alerts</button>
        </div>
        <a class="sitelink ghost" style="color:#7f1d1d" href="${esc(SITE)}" target="_blank" rel="noopener"
           onclick="openSite(); return false;">🔬 Just take me to the LabSynch site</a>
        <div class="foot">Uses the same account as the LabSynch web app.<br>Runs in the system tray and starts with Windows.</div>
      `;
      const btn = document.getElementById("btn");
      const go = async () => {
        if (!L || !L.signIn) {
          document.getElementById("err").textContent =
            "This install is incomplete — use the link below to open the LabSynch site.";
          return;
        }
        btn.disabled = true; btn.textContent = "Signing in…";
        let r = null;
        try {
          r = await L.signIn(document.getElementById("email").value.trim(),
                             document.getElementById("password").value);
        } catch (e) { r = null; }
        if (r && r.ok) {
          window.myName = r.name || "";
          window.myEmail = document.getElementById("email").value.trim();
          return home();
        }
        const err = document.getElementById("err");
        if (r && r.pending) err.textContent = "Your account is awaiting administrator approval.";
        else err.textContent = (r && r.error) ? r.error : "Sign in failed.";
        btn.disabled = false; btn.textContent = "Sign in & enable alerts";
      };
      btn.addEventListener("click", go);
      document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") go();
      });
    }
    window.loginScreen = loginScreen;

    /**
     * Shown only if the preload bridge never arrived. It still links to the
     * LabSynch site, because a blank window is never an acceptable outcome.
     */
    function bridgeMissing() {
      document.getElementById("root").innerHTML = `
        <div class="brand">LabSynch</div>
        <div class="tag">Desktop alerts</div>
        <div class="card">
          <div class="muted">This window couldn't load its own controls, but the
          LabSynch site still works.</div>
        </div>
        <a class="sitelink" href="${esc(SITE)}" target="_blank" rel="noopener">🔬 Open the LabSynch site</a>
        <button class="ghost" onclick="location.reload()">Reload this window</button>
        <div class="foot">${esc(SITE)}</div>`;
    }

    // Paint something immediately — the window must never show a blank frame.
    document.getElementById("root").innerHTML =
      `<div class="brand">LabSynch</div><div class="tag">Starting…</div>`;

    (async () => {
      try {
        if (!L) return bridgeMissing();
        const s = await L.getState();
        if (s && s.signedIn) {
          window.myName = s.name || "";
          window.myEmail = s.email || "";
          home();
        } else {
          loginScreen();
        }
        // Reflect a sign-out that happened from the tray menu.
        if (L.onState) L.onState((st) => {
          if (st && !st.signedIn) { window.myName = ""; window.myEmail = ""; loginScreen(); }
          else if (st && st.signedIn) { window.myName = st.name || ""; window.myEmail = st.email || ""; home(); }
        });
      } catch (e) {
        bridgeMissing();
      }
    })();
  </script>
</body>
</html>
